name: foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  jev-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/jev-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  openclaw-route-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hooks/openclaw/ivan-route
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  openclaw-observer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hooks/openclaw/ivan-observer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
